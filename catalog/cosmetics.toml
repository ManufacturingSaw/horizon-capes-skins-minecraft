# Everything in Tailor's wardrobe: 24 capes, 8 wings, 12 hats, 6 pets and 8 emotes.
# Every piece is an original design, and every piece is free.
#
# id      kind.name, stable forever: players' choices are saved by id
# kind    cape, wings, hat, pet or emote
# colors  the palette the piece is drawn with, main colour first
# motif   the design. Capes are pixel art in Minecraft's 64 x 32 cape layout,
#         drawn at 4x for an HD look (40 x 64 pixels a face)
# about   the one line the app shows under the name
# new     shows a "New" tag in the app

